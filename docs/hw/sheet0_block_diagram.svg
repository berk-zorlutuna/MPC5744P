</tspan></text><text x="633.6" y="-414.59999999999997" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="633.6" dy="10">V_DC isolated</tspan><tspan x="633.6" dy="10">amplifier</tspan><tspan x="633.6" dy="10">(sheet 3)</tspan></text><text x="903.6" y="-414.59999999999997" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="903.6" dy="10">Gate drivers ×6</tspan><tspan x="903.6" dy="10">isolated, DESAT</tspan><tspan x="903.6" dy="10">(sheet 2)</tspan></text><text x="1144.8" y="-414.59999999999997" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="1144.8" dy="10">Hall current</tspan><tspan x="1144.8" dy="10">sensors ×3</tspan><tspan x="1144.8" dy="10">(sheet 3)</tspan></text><text x="219.6" y="-136.60000000000002" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="219.6" dy="10">LV power supply</tspan><tspan x="219.6" dy="10">12 V → 5 V, 3V3,</tspan><tspan x="219.6" dy="10">3V3_A, 5V_PREC,</tspan><tspan x="219.6" dy="10">5V_SENS ×2</tspan><tspan x="219.6" dy="10">(sheet 6)</tspan></text><text x="705.6" y="-136.60000000000002" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="705.6" dy="10">MPC5744P</tspan><tspan x="705.6" dy="10">200 MHz lockstep core</tspan><tspan x="705.6" dy="10">FlexPWM · CTU · ADC ×4</tspan><tspan x="705.6" dy="10">DSPI · FlexCAN · SWT</tspan><tspan x="705.6" dy="10">(sheet 4)</tspan></text><text x="1191.6000000000001" y="-141.60000000000002" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="1191.6000000000001" dy="10">Vehicle interfaces</tspan><tspan x="1191.6000000000001" dy="10">key, brake, P/R/N/D,</tspan><tspan x="1191.6000000000001" dy="10">pedal ×2, CAN,</tspan><tspan x="1191.6000000000001" dy="10">resolver RDC,</tspan><tspan x="1191.6000000000001" dy="10">contactor drivers</tspan><tspan x="1191.6000000000001" dy="10">(sheet 5)</tspan></text><text x="1047.6000000000001" y="-655.2